services:
  - type: web
    name: docintel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AUTO_WORKER
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Avoid downloading a large embedding model on the free 512 MB instance.
      # Switch to "fastembed" on a larger plan for semantic search embeddings.
      - key: EMBEDDING_PROVIDER
        value: hash

  - type: web
    name: docintel-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Public URL of the docintel-api service (no trailing slash).
      - key: BACKEND_URL
        sync: false
