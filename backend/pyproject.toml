[project]
name = "docintel"
version = "1.0.0"
description = "AI-powered document intelligence system (Supabase + Groq)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9",
  "bcrypt>=4.2",
  "httpx>=0.27",
  "filetype>=1.2",
  "PyMuPDF>=1.24",
  "Pillow>=10.4",
  "pytesseract>=0.3.13",
  "tesserocr>=2.7",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "charset-normalizer>=3.3",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
  "pgvector>=0.3",
  "fastembed>=0.3",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
